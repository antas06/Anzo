{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Add Savings Goal</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Goal Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="target_amount">Target Amount ($)</label>
            <input type="number" id="target_amount" name="target_amount" step="0.01" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="current_amount">Current Amount Saved ($) [Optional]</label>
            <input type="number" id="current_amount" name="current_amount" step="0.01" value="0.00" class="form-control">
        </div>
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn">Save Goal</button>
            <a href="{% url 'finance:goal_list' %}" class="btn" style="background-color: #999;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
